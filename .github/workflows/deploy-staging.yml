name: Deploy to Staging

on:
  pull_request:
    branches: [ staging ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'development'

    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      # Install only what deployer needs
      - run: composer install --no-interaction --no-progress --no-dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Export env
        run: |
          echo "SERVER_HOST=${{ secrets.SERVER_HOST }}" >> $GITHUB_ENV
          echo "SERVER_USER=${{ secrets.SERVER_USER }}" >> $GITHUB_ENV

      - name: Deploy to staging
        run: vendor/bin/dep deploy staging
