name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository on GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Deploy to server
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR=/var/www/officeserver
            RELEASES_DIR=$APP_DIR/releases
            RELEASE_DIR=$RELEASES_DIR/$(date +%Y%m%d%H%M%S)

            echo "Creating directories"
            mkdir -p $RELEASE_DIR
            mkdir -p $APP_DIR/shared/storage

            echo "Receiving code from GitHub runner"
            rsync -az --delete \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='tests' \
              --exclude='.env' \
              ${{ github.workspace }}/ $RELEASE_DIR/

            echo "Linking shared .env and storage"
            ln -sfn $APP_DIR/shared/.env $RELEASE_DIR/.env
            rm -rf $RELEASE_DIR/storage
            ln -sfn $APP_DIR/shared/storage $RELEASE_DIR/storage

            cd $RELEASE_DIR

            echo "Installing PHP dependencies"
            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

            echo "Laravel optimizations"
            php artisan key:generate --force || true
            php artisan migrate --force || true
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache || true
            php artisan view:cache || true

            echo "Switching current symlink"
            ln -sfn $RELEASE_DIR $APP_DIR/current

            echo "Deployment completed successfully"
