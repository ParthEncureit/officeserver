name: Deploy Laravel Application

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server (REAL DEPLOY)
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/officeserver/releases/tmp

      - name: Activate release on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            APP_DIR=/var/www/officeserver
            RELEASE_DIR=$APP_DIR/releases/$(date +%Y%m%d%H%M%S)

            mv $APP_DIR/releases/tmp $RELEASE_DIR

            ln -sfn $APP_DIR/shared/.env $RELEASE_DIR/.env
            rm -rf $RELEASE_DIR/storage
            ln -sfn $APP_DIR/shared/storage $RELEASE_DIR/storage

            cd $RELEASE_DIR
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

            php artisan key:generate --force || true
            php artisan migrate --force || true
            php artisan config:clear
            php artisan config:cache

            ln -sfn $RELEASE_DIR $APP_DIR/current
          EOF
